<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" font-family="Inter,-apple-system,'Segoe UI',Arial,sans-serif"><title>Digital Marketing by Vicky: five-stage roadmap</title><rect width="960" height="270" rx="22" fill="#17191F"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A9B0"/></marker></defs><text x="30" y="52" fill="#F4F1EA" font-size="26" font-weight="800">Digital Marketing by Vicky: Roadmap</text><rect x="24" y="90" width="168" height="150" rx="14" fill="#22252D" stroke="#3CC9A0" stroke-width="2"/><text x="108" y="128" fill="#F4F1EA" font-size="16" font-weight="750" text-anchor="middle">Foundations</text><text x="108" y="155" fill="#3CC9A0" font-size="13" font-weight="600" text-anchor="middle">Modules 00–05</text><text x="108" y="182" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">Customers, numbers,</text><text x="108" y="209" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">website, landing page</text><path d="M193 165L207 165" stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)"/><rect x="208" y="90" width="168" height="150" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-width="2"/><text x="292" y="128" fill="#F4F1EA" font-size="16" font-weight="750" text-anchor="middle">Content &amp; Search</text><text x="292" y="155" fill="#6AA6E3" font-size="13" font-weight="600" text-anchor="middle">Modules 06–10</text><text x="292" y="182" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">Copy, design, video,</text><text x="292" y="209" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">SEO, AI search</text><path d="M377 165L391 165" stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)"/><rect x="392" y="90" width="168" height="150" rx="14" fill="#22252D" stroke="#F0A45B" stroke-width="2"/><text x="476" y="128" fill="#F4F1EA" font-size="16" font-weight="750" text-anchor="middle">Social, Email, Ads</text><text x="476" y="155" fill="#F0A45B" font-size="13" font-weight="600" text-anchor="middle">Modules 11–19</text><text x="476" y="182" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">Six platforms, email,</text><text x="476" y="209" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">Google and Meta Ads</text><path d="M561 165L575 165" stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)"/><rect x="576" y="90" width="168" height="150" rx="14" fill="#22252D" stroke="#B79CF0" stroke-width="2"/><text x="660" y="128" fill="#F4F1EA" font-size="16" font-weight="750" text-anchor="middle">Measure &amp; Scale</text><text x="660" y="155" fill="#B79CF0" font-size="13" font-weight="600" text-anchor="middle">Modules 20–25</text><text x="660" y="182" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">GA4, GTM, testing,</text><text x="660" y="209" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">CRM, AI, privacy</text><path d="M745 165L759 165" stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="90" width="168" height="150" rx="14" fill="#22252D" stroke="#F3B552" stroke-width="2"/><text x="844" y="128" fill="#F4F1EA" font-size="16" font-weight="750" text-anchor="middle">Pro</text><text x="844" y="155" fill="#F3B552" font-size="13" font-weight="600" text-anchor="middle">Modules 26–27</text><text x="844" y="182" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">Playbooks, portfolio,</text><text x="844" y="209" fill="#B8B9C1" font-size="13" font-weight="500" text-anchor="middle">career</text></svg>