<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" font-family="Inter,-apple-system,'Segoe UI',Arial,sans-serif"><title>Unit economics of a Mitti Studio order</title><rect width="960" height="290" rx="22" fill="#17191F"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A9B0"/></marker></defs><text x="36" y="52" fill="#F4F1EA" font-size="26" font-weight="800" text-anchor="start">Where one ₹1,800 order goes</text><rect x="36" y="94" width="399.6" height="84" fill="#6AA6E3"/><text x="235.8" y="143" fill="#17191F" font-size="18" font-weight="800" text-anchor="middle">Making ₹810</text><rect x="435.6" y="94" width="88.80000000000001" height="84" fill="#F08A7E"/><text x="480.0" y="205" fill="#F4F1EA" font-size="15" font-weight="600" text-anchor="middle">Delivery + fees ₹180</text><rect x="524.4000000000001" y="94" width="399.6" height="84" fill="#3CC9A0"/><text x="724.2" y="143" fill="#17191F" font-size="18" font-weight="800" text-anchor="middle">Contribution ₹810</text><text x="36" y="250" fill="#3CC9A0" font-size="17" font-weight="700" text-anchor="start">Break-even CPA: ₹810  ·  Keep ₹250 for fixed costs and profit  ·  Target CPA: ₹560</text></svg>